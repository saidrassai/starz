name: ⭐ Sync Stars

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: starz-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.STARZ_PAT }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync starred repos
        env:
          GH_TOKEN: ${{ secrets.STARZ_PAT }}
        run: python3 sync_stars.py

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.STARZ_PAT }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "starz Bot"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes — skipping commit"
            exit 0
          fi

          git add -A
          if git diff --staged --quiet; then
            echo "No staged changes — skipping commit"
            exit 0
          fi

          git commit -m "⬆️ Sync stars - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main
